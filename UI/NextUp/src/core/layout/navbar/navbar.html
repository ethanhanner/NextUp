<div class="header-top">
    <div class="header-logo">
        <img src="/nextup-logo.png" alt="NextUp" class="header-logo-img" />
        <span class="header-title">extUp</span>
    </div>
    <div class="header-nav">
        <nav class="nav-menu">
            @for(item of _items; track item.title) {
                <button class="nav-menu-btn" [routerLink]="item.url" routerLinkActive="active">
                    <ng-icon [name]="item.icon" />
                    <span class="nav-menu-btn-title">{{ item.title }}</span>
                </button>
            }
        </nav>
    </div>
</div>
